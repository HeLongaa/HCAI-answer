name: Manual Build Docker Image For Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        type: string
        required: true
        description: 'Git tag and DockerHub image tag name, for example v2.1.0'

jobs:
  validate-tag:
    if: ${{ github.repository_owner == 'apache' }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate release tag
      shell: bash
      env:
        TAG_NAME: ${{ inputs.tag_name }}
      run: |
        set -euo pipefail
        if [[ ! "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::tag_name must be a semantic version tag like v2.1.0"
          exit 1
        fi
        if ! git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
          echo "::error::git tag ${TAG_NAME} does not exist"
          exit 1
        fi

  quality-gate:
    if: ${{ github.repository_owner == 'apache' }}
    needs: validate-tag
    uses: ./.github/workflows/reusable-quality-gate.yml
    with:
      ref: refs/tags/${{ inputs.tag_name }}

  build:
    if: ${{ github.repository_owner == 'apache' }}
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: refs/tags/${{ inputs.tag_name }}

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
      with:
        images: apache/answer
        tags: |
          type=ref,enable=true,priority=600,prefix=,suffix=,event=branch
          type=semver,pattern={{version}}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

    - name: Login to DockerHub
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        username: ${{ secrets.DOCKERHUB_USER }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        file: ./Dockerfile
        tags: apache/answer:${{ inputs.tag_name }}
        labels: ${{ steps.meta.outputs.labels }}
