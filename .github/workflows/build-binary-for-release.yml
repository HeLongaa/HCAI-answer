name: Build Binary For Release

on:
  push:
    tags:
      - "v*"
permissions:
  contents: write

env:
  GORELEASER_VERSION: v2.16.0

jobs:
  quality-gate:
    if: ${{ github.repository_owner == 'apache' }}
    uses: ./.github/workflows/reusable-quality-gate.yml
    with:
      ref: ${{ github.ref }}

  build-goreleaser:
    if: ${{ github.repository_owner == 'apache' }}
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 20.18.1

    - name: Node Build
      run: make install-ui-packages ui

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.24.1

    - name: Install GoReleaser
      run: go install github.com/goreleaser/goreleaser/v2@${GORELEASER_VERSION}

    - name: Run GoReleaser
      run: |
        "$(go env GOPATH)/bin/goreleaser" release --clean --skip=validate
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/upload-artifact@v4
      with:
        name: answer
        path: ./dist/*
